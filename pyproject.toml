[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "react-ai"
version = "0.1.0"
description = "Enterprise-grade Production AI Agent Framework (Reasoning + Acting)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "httpx>=0.27.0",
    "tenacity>=8.3.0",
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "jinja2>=3.1.4",
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "langgraph-checkpoint-postgres>=2.0.0",
    "psycopg[binary]>=3.1.0",
    "psycopg-pool>=3.1.0",
    "asyncpg>=0.29.0",
    "sqlalchemy>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "mypy>=1.10.0",
    "ruff>=0.4.0",
]
redis = ["redis>=5.0.0"]
postgres = ["asyncpg>=0.29.0", "sqlalchemy>=2.0.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/react_ai"]
